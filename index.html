<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Algorithm Visualizer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>ALGO<span class="accent">/</span>VISUALIZER</h1>
      <div class="subtitle">bubble &middot; selection &middot; insertion &middot; binary search</div>
    </div>
    <div class="status-badge" id="statusBadge">idle</div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" data-algo="bubble">Bubble Sort</button>
    <button class="tab" data-algo="selection">Selection Sort</button>
    <button class="tab" data-algo="insertion">Insertion Sort</button>
    <button class="tab" data-algo="binary">Binary Search</button>
  </div>

  <div class="panel">
    <div class="viz-area" id="vizArea"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="panel">
    <div class="controls">
      <div class="field">
        <label for="sizeSlider">Array size — <span id="sizeVal">20</span></label>
        <input type="range" id="sizeSlider" min="5" max="50" value="20">
      </div>
      <div class="field">
        <label for="speedSlider">Speed — <span id="speedVal">Normal</span></label>
        <input type="range" id="speedSlider" min="1" max="5" value="3">
      </div>
      <div class="field" id="targetField" style="display:none;">
        <label for="targetInput">Target value</label>
        <input type="number" id="targetInput" value="42">
      </div>
      <button id="newArrayBtn">New Array</button>
      <button id="stepBtn">Step ▸</button>
      <button id="playBtn" class="primary">Play ▸</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="info-row">
    <div class="panel">
      <p class="panel-title">Current Step</p>
      <div class="step-log" id="stepLog">Press <b>New Array</b> then <b>Play</b> or <b>Step</b> to begin.</div>
    </div>
    <div class="panel">
      <p class="panel-title">Complexity</p>
      <table id="complexityTable"></table>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
